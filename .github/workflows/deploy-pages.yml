name: Deploy dashboard

# 静态看板过去只能靠本地 deploy_pages.bat 手动发布，导致仓库已修复、线上
# 仍是旧版本。这里把「构建 + 部署」接进 CI：
#   - push 到 main 且影响站点内容时自动发布；
#   - 每日 Agent 跑完后自动发布，让公网看板跟上最新一期日报；
#   - 也可手动触发。
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "reports/**"
      - "tools/build_static_site.py"
      - "agent_utils.py"
      - ".github/workflows/deploy-pages.yml"
  workflow_run:
    workflows: ["Daily competitor monitor"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-pages
  cancel-in-progress: true

jobs:
  deploy:
    # workflow_run 会在被触发的工作流失败时也触发，这里只在成功后才发布。
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AGENT_RUNTIME_DIR: ${{ github.workspace }}/runtime
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_RUNTIME_PREFIX: aigc-competitor-agent/runtime
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 构建器本身只用标准库；httpx 仅供 R2 拉取 runtime 使用。
      - name: Install sync dependency
        run: python -m pip install "httpx==0.28.1"

      # 站点要展示 Agent 的真实产出，而不是仓库里的演示数据。R2 未配置时
      # 退回演示数据继续发布，不让部署整体失败。
      - name: Restore runtime from R2
        continue-on-error: true
        run: python r2_runtime_sync.py pull

      - name: Build static site
        run: python tools/build_static_site.py

      # 契约测试会临时用哨兵数据重建 dist 再还原；因此放在最终构建之前跑，
      # 确保发布出去的一定是这一步之后的权威产物。
      - name: Verify build contract
        run: python -m unittest tests.test_static_site_build -v

      - name: Rebuild authoritative dist
        run: python tools/build_static_site.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name aigc-intel-hub --branch=main
