name: Daily competitor monitor

on:
  schedule:
    - cron: "30 1 * * *" # 09:30 Asia/Shanghai (UTC+8)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-competitor-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: ${{ vars.AGENT_SCHEDULE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AGENT_RUNTIME_DIR: ${{ github.workspace }}/runtime
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_RUNTIME_PREFIX: aigc-competitor-agent/runtime
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
      WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
      OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MAX_MODEL_CALLS: "20"
      MAX_TOTAL_TOKENS: "120000"
      RUN_TIMEOUT_SECONDS: "900"
      EVIDENCE_MAX_RUNS: "30"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python and browser dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          crawl4ai-setup
      - name: Restore last successful runtime from R2
        run: python r2_runtime_sync.py pull
      - name: Run daily monitor
        run: python step3_agent.py
      - name: Persist runtime to R2
        if: always()
        run: python r2_runtime_sync.py push
